services:
  mongo:
    image: mongo:8
    container_name: ecommerce-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ml-service:
    build:
      context: ./ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: "mongodb://mongo:27017/ecommerce?directConnection=true"
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  redis_data: