services:
  mongo:
    image: mongo:8
    container_name: ecommerce-mongo
    restart: unless-stopped
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ml-service:
    build:
      context: ./ml-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGO_URI: "mongodb://mongo:27017/ecommerce?directConnection=true"
    depends_on:
      mongo:
        condition: service_healthy

  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      MONGO_URI: "mongodb://mongo:27017/ecommerce?directConnection=true"
      REDIS_URL: "redis://redis:6379"
      ML_SERVICE_URL: "http://ml-service:8000"
      DJANGO_ADMIN_URL: "http://django-admin:8001"
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-service:
        condition: service_started

  django-admin:
    build:
      context: ./django-admin
    restart: unless-stopped
    env_file:
      - ./django-admin/.env
    environment:
      MONGO_URI: "mongodb://mongo:27017/ecommerce?directConnection=true"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,django-admin"
      DJANGO_DEBUG: "False"
    ports:
      - "8001:8001"
    volumes:
      - ./django-admin/db.sqlite3:/app/db.sqlite3
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  redis_data:
